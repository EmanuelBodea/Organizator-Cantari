name: Construire EXE Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app.py'
      - 'updater.py'
      - 'update_config.json'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descarca sursele
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaleaza PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Verifica sintaxa Python
        run: python -m py_compile app.py updater.py

      - name: Construieste EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Organizator-Cantari-Betel-Padureni" app.py

      - name: Arhiveaza EXE pentru descarcare
        uses: actions/upload-artifact@v4
        with:
          name: Organizator-Cantari-Betel-Padureni-Windows
          path: |
            dist/Organizator-Cantari-Betel-Padureni.exe
            update_config.json
          if-no-files-found: error

      - name: Genereaza manifestul pentru actualizari
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $source = Get-Content -Path app.py -Raw
          if ($source -notmatch "APP_VERSION\s*=\s*.(\d+\.\d+\.\d+).") { throw "Nu am gasit APP_VERSION in app.py" }
          $version = $Matches[1]
          $tag = "v$version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tagul trebuie sa fie vMAJOR.MINOR.PATCH' }
          if ("${{ github.ref }}" -ne "refs/heads/main" -and "${{ github.ref_name }}" -ne $tag) { throw "Tagul nu corespunde versiunii din app.py" }
          $exe = "dist/Organizator-Cantari-Betel-Padureni.exe"
          $sha = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/Organizator-Cantari-Betel-Padureni.exe"
          $manifest = @{ version = $version; notes = "Versiunea $version"; url = $url; sha256 = $sha }
          $manifest | ConvertTo-Json | Set-Content -Path update.json -Encoding utf8

      - name: Publica GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $source = Get-Content -Path app.py -Raw
          if ($source -notmatch "APP_VERSION\s*=\s*.(\d+\.\d+\.\d+).") { throw "Nu am gasit APP_VERSION in app.py" }
          $tag = "v$($Matches[1])"
          $files = @("dist/Organizator-Cantari-Betel-Padureni.exe", "update.json", "update_config.json")
          gh release view "$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" @files --clobber
          } else {
            gh release create "$tag" @files --target main --title "Organizator Cantari $tag" --notes "Versiune Windows. Autor: Bodea Emanuel. Actualizarea se instaleaza numai cu confirmare."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publicarea GitHub Release a esuat." }
